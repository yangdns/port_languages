<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chinese Reading easily, with Pinyin & vice versa  中文标拼音阅读、中文-外语直接互学 </title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --text: #222;
      --muted: #4EA8DE;
      --line: #d9d9d2;
      --panel: #fff;
      --accent: #2b6cb0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191c;
        --text: #eceff3;
        --muted: #a6adb7;
        --line: #30343a;
        --panel: #202329;
        --accent: #7db2ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(920px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
      color: var(--text);
      font: 18px/1.7 "Songti SC", "Noto Serif CJK SC", "Microsoft YaHei", serif;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 78%);
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 14px 0 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .language {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .language label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language select {
      width: min(260px, 100%);
    }

    .tts {
      display: grid;
      grid-template-columns: 1fr 180px auto auto auto;
      gap: 10px;
      align-items: center;
      margin: 0 0 18px;
    }

    .rate {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    select,
    input[type="range"] {
      min-width: 0;
    }

    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #output {
      min-height: 180px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      font: 24px/1.7 "Songti SC", "Noto Serif CJK SC", "Microsoft YaHei", serif;
      overflow-wrap: anywhere;
    }

    .sentence {
      display: block;
      border-radius: 8px;
      padding: 12px 10px;
      margin: 0 0 14px;
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .sentence.speaking {
      background: color-mix(in srgb, var(--accent), transparent 82%);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 88%);
    }

    .aligned {
      display: flex;
      flex-wrap: wrap;
      gap: 0.08em 0.32em;
      align-items: end;
    }

    .word {
      display: grid;
      grid-template-rows: auto auto auto;
      justify-items: center;
      align-items: end;
      min-width: 1em;
      margin-block: 0.08em;
    }

    .word.space {
      min-width: 0.6em;
    }

    .py,
    .literal {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      line-height: 1.2;
      user-select: text;
      text-align: center;
    }

    .py {
      font-size: 0.58em;
    }

    .zh {
      line-height: 1.45;
    }

    .literal {
      font-size: 0.5em;
      max-width: 8em;
    }

    .natural {
      margin-top: 6px;
      color: #d26a1e;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 0.72em;
      font-style: italic;
      line-height: 1.45;
    }

    .subject .py,
    .subject .zh,
    .subject .literal {
      color: #d12b2b;
    }

    .predicate .py,
    .predicate .zh,
    .predicate .literal {
      font-weight: 800;
    }

    .plain {
      margin-inline: 0.02em;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .tts {
        grid-template-columns: 1fr 1fr;
      }

      .tts select,
      .rate {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

      if (outLang.google !== "en") return "...";

      for (const [source, gloss] of contextualGlosses) {
        if (text.endsWith(source) && text.length > source.length) return gloss;
      }

      return "...";
    }

    function pickWordsFromNatural(text, naturalText) {
      const words = naturalText.match(/[A-Za-z']+/g) || [];
      const lowerWords = words.map((word) => word.toLowerCase());

      const hints = [
        ["银行", ["bank"]],
        ["行", ["okay", "works", "line", "row"]],
        ["忙", ["busy"]],
        ["学习", ["study", "learn"]],
        ["想学习", ["want", "study"]],
        ["会说", ["can", "speak"]],
        ["想", ["want", "would", "like"]],
        ["中文", ["chinese"]],
        ["今天", ["today"]],
        ["重庆", ["chongqing"]],
        ["漂亮", ["beautiful", "pretty"]],
        ["高兴", ["happy", "glad"]],
        ["重要", ["important"]],
        ["简单", ["simple", "easy"]],
        ["难", ["hard", "difficult"]]
      ];

      const hint = hints.find(([source]) => text.includes(source));
      if (!hint) return "";

      const found = hint[1].find((word) => lowerWords.includes(word));
      return found || hint[1][0];
    }

    function findPredicate(tokens) {
      const candidates = [];

      tokens.forEach((token, index) => {
        const text = token.text.trim();
        const pos = token.pos.toLowerCase();
        if (!text || !hanzi.test(text)) return;
        if (
          commonPredicates.has(text)
          || [...commonPredicates].some((word) => text.endsWith(word))
          || pos.startsWith("v")
          || pos.includes("verb")
          || pos.startsWith("a")
          || pos.includes("adjective")
        ) {
          candidates.push(index);
        }
      });

      if (candidates.length) return new Set([candidates[0]]);

      let nounPredicate = -1;
      for (let index = tokens.length - 1; index > 0; index -= 1) {
        const token = tokens[index];
        if (
          hanzi.test(token.text)
          && token.text.trim()
          && !functionWords.has(token.text.trim())
          && !/[，,。！？!?；;]/.test(token.text)
        ) {
          nounPredicate = index;
          break;
        }
      }

      return new Set(nounPredicate >= 0 ? [nounPredicate] : []);
    }

    function findSubject(tokens, predicate) {
      const predicateIndex = [...predicate][0] ?? -1;
      if (predicateIndex <= 0) return new Set();

      const subject = new Set();
      for (let index = predicateIndex - 1; index >= 0; index -= 1) {
        const token = tokens[index];
        if (!token.text.trim()) continue;
        if (/[，,。！？!?；;]/.test(token.text)) break;
        if (hanzi.test(token.text)) {
          subject.add(index);
          continue;
        }
      }

      return subject;
    }

    async function translateSentence(text, sentenceNode, sentenceIndex, session) {
      try {
        const preservedTargetText = displaySentences[sentenceIndex]?.targetText;
        const naturalText = preservedTargetText || await translateText(text, "zh-CN", outputLanguage().google);
        if (session !== renderSession || !output.contains(sentenceNode)) return;
        displaySentences[sentenceIndex].targetText = naturalText;
        displaySentences[sentenceIndex].spokenText = targetIsChinese() ? text : naturalText;
        const analysis = analyzeSentence(text, naturalText);
        await fillContextualGlosses(analysis.tokens, naturalText);
        if (session !== renderSession || !output.contains(sentenceNode)) return;
        renderSentence(sentenceNode, analysis, naturalText);
      } catch {
        if (session !== renderSession || !output.contains(sentenceNode)) return;
        renderSentence(sentenceNode, analyzeSentence(text, ""), bilingual("无法翻译", currentLanguage().unavailable));
      }
    }

    async function fillContextualGlosses(tokens, naturalText) {
      await Promise.all(tokens.map(async (token) => {
        if (!token.text.trim()) return;

        const outLang = outputLanguage();

        if (outLang.google === "zh-CN") {
          token.literal = token.text;
          return;
        }

        if (outLang.google !== "en" && contextualGlosses.has(token.text.trim())) {
          try {
            token.literal = await translateText(contextualGlosses.get(token.text.trim()), "en", outLang.google);
            return;
          } catch {
            token.literal = contextualGlosses.get(token.text.trim());
            return;
          }
        }

        if (token.literal !== "...") return;

        try {
          const translated = await translateText(token.text, "zh-CN", outLang.google);
          token.literal = cleanLiteral(translated, naturalText);
        } catch {
          token.literal = token.text;
        }
      }));
    }

    function cleanLiteral(translated, naturalText) {
      const text = translated.trim();
      if (!text) return "...";
      const natural = naturalText.toLowerCase();
      const lower = text.toLowerCase();

      if (natural.includes(lower)) return text;
      return text.replace(/^to\s+/i, "");
    }

    async function translateText(text, source = "zh-CN", target = currentLanguage().google) {
      const trimmed = text.trim();
      if (!trimmed) return "\u00a0";
      const key = `${source}-${target}:${trimmed}`;
      if (translationCache.has(key)) return translationCache.get(key);

      const googleUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(source)}&tl=${encodeURIComponent(target)}&dt=t&q=${encodeURIComponent(trimmed)}`;
      const google = await fetch(googleUrl);
      if (google.ok) {
        const data = await google.json();
        const translated = data?.[0]?.map((part) => part?.[0] || "").join("").trim();
        if (translated) {
          translationCache.set(key, translated);
          return translated;
        }
      }

      if (source === "auto") throw new Error("translation failed");
      const memoryTarget = Object.values(languages).find((lang) => lang.google === target)?.memory || target;
      const memoryUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(trimmed)}&langpair=${encodeURIComponent(source)}|${encodeURIComponent(memoryTarget)}`;
      const memory = await fetch(memoryUrl);
      if (!memory.ok) throw new Error("translation failed");
      const data = await memory.json();
      const translated = data?.responseData?.translatedText?.trim();
      if (!translated) throw new Error("translation missing");
      translationCache.set(key, translated);
      return translated;
    }

    function splitSentences(text) {
      const result = [];
      let start = 0;

      for (let index = 0; index < text.length; index += 1) {
        if (sentenceEnd.test(text[index])) {
          result.push({ text: text.slice(start, index + 1), start, end: index + 1 });
          start = index + 1;
        }
      }

      if (start < text.length) {
        result.push({ text: text.slice(start), start, end: text.length });
      }

      return result;
    }

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      const current = voiceSelect.value;
      voiceSelect.replaceChildren();

      if (!voices.length) {
        const option = document.createElement("option");
        option.textContent = bilingual("正在加载系统语音...", currentLanguage().voicesLoading);
        voiceSelect.append(option);
        return;
      }

      for (const voice of voices) {
        const option = document.createElement("option");
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.default) option.textContent += " 默认";
        voiceSelect.append(option);
      }

      const targetVoiceLang = targetLanguage().tts || targetLanguage().google || "zh";
      const targetVoicePrefix = targetVoiceLang.split("-")[0];
      const preferred = voices.find((voice) => voice.name === current && voice.lang.toLowerCase().startsWith(targetVoicePrefix.toLowerCase()))
        ?? voices.find((voice) => voice.lang.toLowerCase() === targetVoiceLang.toLowerCase())
        ?? voices.find((voice) => voice.lang.toLowerCase().startsWith(targetVoicePrefix.toLowerCase()))
        ?? voices.find((voice) => voice.default)
        ?? voices[0];

      if (preferred) voiceSelect.value = preferred.name;
    }

    function selectedVoice() {
      return voices.find((voice) => voice.name === voiceSelect.value) ?? null;
    }

    function setActiveSentence(index) {
      activeSentence = index;
      output.querySelectorAll(".sentence.speaking").forEach((node) => {
        node.classList.remove("speaking");
      });

      if (index < 0) return;

      const node = output.querySelector(`[data-sentence="${index}"]`);
      if (node) {
        node.classList.add("speaking");
        node.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    function sentenceIndexFromSelection() {
      const selection = window.getSelection();
      const selectedNode = selection?.rangeCount ? selection.anchorNode : null;
      const selectedElement = selectedNode?.nodeType === Node.TEXT_NODE
        ? selectedNode.parentElement
        : selectedNode;
      const selectedSentence = selectedElement?.closest?.(".sentence");

      if (selectedSentence && output.contains(selectedSentence)) {
        return Number(selectedSentence.dataset.sentence) || 0;
      }

      if (!sourceHasChinese(input.value)) return 0;

      const position = input.selectionStart ?? 0;
      const index = sentences.findIndex((sentence) => (
        position >= sentence.start && position < sentence.end
      ));

      if (index >= 0) return index;

      const nextIndex = sentences.findIndex((sentence) => position < sentence.start);
      if (nextIndex >= 0) return nextIndex;

      return Math.max(sentences.length - 1, 0);
    }

    function speakFrom(startIndex = 0) {
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        status.textContent = bilingual("当前浏览器不支持朗读", currentLanguage().ttsUnsupported);
        return;
      }

      if (!displaySentences.length) return;

      loadVoices();
      speechSynthesis.cancel();
      const session = playSession += 1;
      const voice = selectedVoice();
      let index = Math.max(0, Math.min(startIndex, displaySentences.length - 1));

      const speakNext = () => {
        if (session !== playSession) return;

        const sentence = displaySentences[index];

        if (!sentence) {
          setActiveSentence(-1);
          status.textContent = countText(input.value);
          return;
        }

        if (!sentence.spokenText) {
          status.textContent = bilingual("翻译中...", currentLanguage().translating);
          return;
        }

        const text = sentence.spokenText.trim();
        if (!text) {
          index += 1;
          speakNext();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = voice?.lang || targetLanguage().tts || targetLanguage().google || "zh-CN";
        utterance.voice = voice;
        utterance.rate = Number(rate.value);
        utterance.onstart = () => {
          if (session !== playSession) return;
          setActiveSentence(index);
          status.textContent = bilingual(`朗读第 ${index + 1} 句 / ${displaySentences.length}`, currentLanguage().readSentence(index + 1, displaySentences.length));
        };
        utterance.onend = () => {
          if (session !== playSession) return;
          index += 1;
          speakNext();
        };
        utterance.onerror = () => {
          if (session !== playSession) return;
          setActiveSentence(-1);
          status.textContent = bilingual("朗读已停止", currentLanguage().stopped);
        };
        speechSynthesis.speak(utterance);
      };

      speakNext();
    }

    rate.addEventListener("input", () => {
      rateValue.textContent = `${Number(rate.value).toFixed(2)}x`;
    });
    function handleLanguageChange() {
      playSession += 1;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      applyLanguage();
      loadVoices();
      if (pinyin) mark(input.value);
    }

    targetLang.addEventListener("change", handleLanguageChange);
    learningLang.addEventListener("change", handleLanguageChange);
    play.addEventListener("click", () => speakFrom(0));
    playFromSelection.addEventListener("click", () => speakFrom(sentenceIndexFromSelection()));
    stop.addEventListener("click", () => {
      playSession += 1;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      setActiveSentence(-1);
      status.textContent = countText(input.value);
    });
    input.addEventListener("input", () => {
      playSession += 1;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      applyLanguage();
      if (pinyin) mark(input.value);
    });
    clear.addEventListener("click", () => {
      playSession += 1;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      input.value = "";
      input.focus();
      if (pinyin) mark("");
    });

    if ("speechSynthesis" in window) {
      loadVoices();
      speechSynthesis.addEventListener("voiceschanged", loadVoices);
    } else {
      voiceSelect.innerHTML = `<option>${bilingual("当前浏览器不支持朗读", currentLanguage().ttsMissing)}</option>`;
      play.disabled = true;
      playFromSelection.disabled = true;
      stop.disabled = true;
    }

    applyLanguage();

    try {
      ({ pinyin } = await import("https://cdn.jsdelivr.net/npm/pinyin-pro@3/+esm"));
      try {
        const segmentit = await import("https://cdn.jsdelivr.net/npm/segmentit@2.0.3/+esm");
        segment = segmentit.useDefault(new segmentit.Segment());
        enPOSTag = segmentit.enPOSTag;
      } catch {
        segment = null;
        enPOSTag = null;
      }
      mark(input.value);
    } catch {
      output.innerHTML = `<span class="empty">${bilingual("拼音库加载失败，请联网后刷新页面。", currentLanguage().pinyinFailed)}</span>`;
      status.textContent = bilingual("未加载", "Not loaded");
    }
  </script>
</body>
</html>
